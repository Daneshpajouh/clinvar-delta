name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts bin/cvnf
      - run: ruff format --check src tests scripts
      - run: mypy
      - run: pytest tests/unit --cov=cvnf --cov-report=term

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - run: shellcheck scripts/*.sh
      - run: bats tests/bats

  pipeline:
    runs-on: ubuntu-latest
    env:
      CVNF_NF_PROFILE: test,docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.10.2"
      - uses: nf-core/setup-nf-test@v1
        with:
          version: "0.9.5"
      - run: pip install -e '.[dev]'
      - name: Build the tools image used by the docker profile
        run: docker build -f containers/Dockerfile -t ghcr.io/daneshpajouh/clinvar-variant-nf:1.0.0 .
      - name: Pipeline tests (test profile, diff profile, resume, stub run)
        run: pytest -m pipeline tests/pipeline
      - name: nf-test modules and pipeline
        run: nf-test test tests/nf-test --profile test,docker

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build --strict
