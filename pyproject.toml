[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cvnf"
version = "1.0.0"
description = "Reporting, ClinVar release diff and job profiling tools for the clinvar-variant-nf pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Amir Daneshpajouh" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6", "jsonschema>=4"]

[project.scripts]
cvnf = "cvnf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "PL", "PT", "C4"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pipeline: runs Nextflow or Snakemake end to end on the bundled test data (slow)",
    "docker: needs a running Docker daemon",
]
addopts = "-ra --strict-markers"
